services:
  - type: web
    name: probador-senati
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/salud
    envVars:
      - key: CLAVE_MOTOR
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
